[package]
name = "markydowny"
version = "1.2.0"
description = "A simple, beautiful markdown viewer"
authors = ["Working Devs Hero"]
edition = "2021"

[lib]
name = "markydowny_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Canonical paths without the \\?\ prefix std::fs::canonicalize gives on Windows, which the
# page can't resolve relative links against.
dunce = "1"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
bugsplat = "0.1.1"
tauri-plugin-bugsplat = "0.1.1"

# markychecky's hook (markychecky.rs): flock, localtime_r and the passwd database.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# AppKit window tabs (tab mode, adding tabs); same versions tao already uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSApplicationScripting",
    "NSEvent",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }

[dev-dependencies]
tempfile = "3"

# Line tables + a packed .dSYM so BugSplat can symbolicate (npm run symbols).
[profile.release]
debug = "line-tables-only"
split-debuginfo = "packed"

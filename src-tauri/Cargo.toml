[package]
name = "markydowny"
version = "1.0.0"
description = "A simple, beautiful markdown viewer"
authors = ["Working Devs Hero"]
edition = "2021"

[lib]
name = "markydowny_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bugsplat = "0.1"
tauri-plugin-bugsplat = "0.1"

[dev-dependencies]
tempfile = "3"

# Line tables + a packed .dSYM so BugSplat can symbolicate (npm run symbols).
[profile.release]
debug = "line-tables-only"
split-debuginfo = "packed"

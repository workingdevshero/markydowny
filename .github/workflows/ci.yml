name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The tests need nothing from node_modules: marked is checked in under js/vendor/.
      - run: node --test tests/*.test.js

  desktop:
    # The app is macOS-only (Crashpad's prebuilt needs macOS 12+).
    runs-on: macos-latest
    # A cold build takes a while; a hung one should fail long before GitHub's 6-hour limit.
    timeout-minutes: 60
    # The first run's runner died mid-build ("lost communication": CPU or memory starvation).
    # No debug info and no incremental artifacts keep linking light, and two jobs leave headroom
    # on the 3-core, 7 GB runner.
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            src-tauri/target
            .crashpad-cache
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'rust-toolchain.toml') }}
      # tauri::generate_context! embeds dist/ at compile time, so it has to exist first.
      - run: node scripts/build-frontend.mjs
      # Built without BUGSPLAT_DATABASE, so this build has crash reporting turned off.
      - run: cargo test --manifest-path src-tauri/Cargo.toml
        env:
          BUGSPLAT_CRASHPAD_CACHE: ${{ github.workspace }}/.crashpad-cache
      # markychecky's tests again, on the app's `markychecky` mode as well as the Python script.
      - run: cargo build --manifest-path src-tauri/Cargo.toml
        env:
          BUGSPLAT_CRASHPAD_CACHE: ${{ github.workspace }}/.crashpad-cache
      - run: node --test tests/markychecky.test.js
        env:
          MARKYDOWNY_BIN: src-tauri/target/debug/markydowny

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    # As in the desktop job: no debug info and no incremental artifacts keep the build light.
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            src-tauri/target
            .crashpad-cache
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'rust-toolchain.toml') }}
      # scripts/build-desktop.ps1 is what supermog's Windows round builds with, so it builds here
      # too, in Windows PowerShell 5.1 as there. It loads MSVC's environment (bugsplat-sys needs
      # its compiler, linker and lib.exe on PATH), fetches Ninja, and builds the debug .exe. The
      # tests run in the same step, so they keep that environment. Not Git Bash: it puts its own
      # link.exe ahead of MSVC's.
      - name: Build with build-desktop.ps1, then test
        shell: powershell
        env:
          BUGSPLAT_CRASHPAD_CACHE: ${{ github.workspace }}/.crashpad-cache
        run: |
          $ErrorActionPreference = 'Continue'
          .\scripts\build-desktop.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Built without BUGSPLAT_DATABASE, so this build has crash reporting turned off.
          cargo test --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      # A --no-bundle build has no BugSplat helpers next to the .exe. With crash reporting off it
      # must start without them, as it does in a Windows round.
      - name: Start the built app
        shell: powershell
        run: |
          $exe = .\scripts\build-desktop.ps1 -PrintPath
          $app = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { throw "markydowny.exe exited with $($app.ExitCode) within 15 seconds" }
          Stop-Process -Id $app.Id
          Write-Output "markydowny.exe started and kept running"

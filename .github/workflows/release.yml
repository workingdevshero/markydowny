name: Release

# Pushing a version tag (v1.2.0, or v1.2.0-beta.1 for a prerelease) builds the desktop app for
# macOS, Linux and Windows, attaches it to a release and publishes the release once every file is there.
# workflow_dispatch on a tag releases it too: tag-release.yml starts it that way when a version
# bump merges, since a tag it creates doesn't trigger the push. Pull requests that change the
# release build, and workflow_dispatch on any branch, run the same builds as a dry run:
# everything except the release job.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/release-mac.sh
      - scripts/build-frontend.mjs
      - scripts/check-release-version.mjs
      - src-tauri/build.rs
      - src-tauri/src/bundled_helpers.rs
      - src-tauri/tauri.conf.json
      - src-tauri/tauri.windows.conf.json
  workflow_dispatch:

# Read-only everywhere; only the release job can write.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # A newer push to a PR supersedes its dry run; a tag's run always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # On a tag, the tag must match package.json, src-tauri/Cargo.toml and tauri.conf.json, or
      # the run stops here, naming the file that's wrong. A dry run checks the three agree.
      - id: check
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            node scripts/check-release-version.mjs "$GITHUB_REF_NAME"
          else
            node scripts/check-release-version.mjs
          fi

  mac:
    needs: version
    runs-on: macos-latest
    outputs:
      # Whether the .dmg is signed with the Developer ID and notarized, for the release notes.
      notarized: ${{ steps.signing.outputs.notarized }}
    # A universal build compiles everything twice, once per architecture.
    timeout-minutes: 90
    # As in ci.yml's desktop job: no debug info and no incremental artifacts keep linking light,
    # and two jobs leave headroom on the 3-core, 7 GB runner, which otherwise dies mid-build.
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_BUILD_JOBS: 2
      BUGSPLAT_CRASHPAD_CACHE: ${{ github.workspace }}/.crashpad-cache
      # Empty when the secret isn't set (a fork's PR): the build then has crash reporting off.
      BUGSPLAT_DATABASE: ${{ secrets.BUGSPLAT_DATABASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Not src-tauri/target: a tag's cache is only ever visible to that tag, so caching the
      # build only speeds up re-runs, and a universal release build is gigabytes.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            .crashpad-cache
          key: release-${{ runner.os }}-universal-${{ hashFiles('src-tauri/Cargo.lock', 'rust-toolchain.toml') }}
      # With the Apple secrets (tags, workflow_dispatch and this repository's PRs), the app is
      # signed with the Developer ID and notarized. Without them (a fork's PR) it's signed ad hoc
      # and not notarized. The certificate and the notarytool profile go into a temporary
      # keychain, which the clean-up step deletes. No secret, nor anything made from one, is
      # printed: the derived values are masked.
      - name: Set up signing
        id: signing
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          names=(APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD APPLE_TEAM_ID APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER_ID)
          missing=()
          for name in "${names[@]}"; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} == ${#names[@]} )); then
            echo "notarized=false" >> "$GITHUB_OUTPUT"
            echo "macOS: ad-hoc signed and **not notarized**: the Apple signing secrets aren't set (a fork's pull request). Gatekeeper blocks this .dmg on other Macs." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          elif (( ${#missing[@]} )); then
            echo "::error::Some Apple signing secrets are set but not these: ${missing[*]}"
            exit 1
          fi

          keychain="$RUNNER_TEMP/markydowny-signing.keychain-db"
          p12="$RUNNER_TEMP/developer-id.p12"
          p8="$RUNNER_TEMP/notary-key.p8"
          password=$(openssl rand -base64 32)
          echo "::add-mask::$password"
          (
            umask 077
            base64 --decode <<< "$APPLE_CERTIFICATE_P12" > "$p12"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$p8"
          )

          security create-keychain -p "$password" "$keychain"
          # No auto-lock during a long build.
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$p12" -k "$keychain" -f pkcs12 -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security > /dev/null
          # Lets codesign use the key without a prompt, which would hang the build.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          # Add it to the search list, ahead of the keychains already there, for codesign.
          existing=()
          while IFS= read -r k; do existing+=("$k"); done < <(security list-keychains -d user | sed -E 's/^ *"(.*)"$/\1/')
          security list-keychains -d user -s "$keychain" "${existing[@]}"

          # The SHA-1 of the team's Developer ID Application identity, rather than its name: the
          # name has an apostrophe in it.
          ids=$(security find-identity -v -p codesigning "$keychain" \
            | grep -F "($APPLE_TEAM_ID)\"" | grep -F '"Developer ID Application: ' | awk '{ print $2 }' || true)
          [[ $(grep -c . <<< "$ids") -eq 1 ]] || { echo "::error::Expected one Developer ID Application identity for the team in the certificate, found $(grep -c . <<< "$ids")"; exit 1; }
          echo "::add-mask::$ids"

          xcrun notarytool store-credentials markydowny-notary --key "$p8" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" --keychain "$keychain" > /dev/null
          rm -f "$p12" "$p8"

          {
            echo "identity=$ids"
            echo "keychain=$keychain"
            echo "notarized=true"
          } >> "$GITHUB_OUTPUT"
      - name: Build, sign and package
        env:
          NOTARIZE: ${{ steps.signing.outputs.notarized }}
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          NOTARY_KEYCHAIN: ${{ steps.signing.outputs.keychain }}
        run: |
          if [[ "$NOTARIZE" == "true" ]]; then
            scripts/release-mac.sh --arch universal --identity "$SIGNING_IDENTITY" --notary-profile markydowny-notary
          else
            scripts/release-mac.sh --arch universal --identity - --no-notarize
          fi
      # release-mac.sh already staples and assesses the .dmg; this checks the app inside it too,
      # and that Gatekeeper accepts it as notarized, not just signed.
      - name: Check the signature and notarization
        if: steps.signing.outputs.notarized == 'true'
        run: |
          dmg=$(echo dist-release/*.dmg)
          spctl --assess --type open --context context:primary-signature -v "$dmg"
          xcrun stapler validate "$dmg"
          mount=$(mktemp -d)
          hdiutil attach "$dmg" -nobrowse -noautoopen -readonly -mountpoint "$mount" -quiet
          trap 'hdiutil detach "$mount" -quiet' EXIT
          assessment=$(spctl --assess -v "$mount"/*.app 2>&1) || { echo "$assessment"; exit 1; }
          echo "$assessment"
          grep -q '^source=Notarized Developer ID$' <<< "$assessment" \
            || { echo "::error::Gatekeeper accepts the app, but not as notarized"; exit 1; }
          echo "macOS: signed and notarized: Gatekeeper accepts the .dmg and the app in it, and the ticket is stapled." >> "$GITHUB_STEP_SUMMARY"
      - name: Clean up signing
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/markydowny-signing.keychain-db" 2> /dev/null || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary-key.p8"
      - name: Crash reporting
        run: |
          if [[ -n "$BUGSPLAT_DATABASE" ]]; then
            echo "macOS: crash reporting is on." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "macOS: crash reporting is **off**: the BUGSPLAT_DATABASE secret isn't set." >> "$GITHUB_STEP_SUMMARY"
          fi
      # One .dSYM per architecture: Tauri lipos the binaries of a universal build, not the dSYMs.
      - name: Upload symbols
        if: github.ref_type == 'tag'
        # A failed upload leaves crashes unsymbolicated, but shouldn't hold back the release.
        continue-on-error: true
        env:
          SYMBOL_UPLOAD_CLIENT_ID: ${{ secrets.SYMBOL_UPLOAD_CLIENT_ID }}
          SYMBOL_UPLOAD_CLIENT_SECRET: ${{ secrets.SYMBOL_UPLOAD_CLIENT_SECRET }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [[ -z "$BUGSPLAT_DATABASE" || -z "$SYMBOL_UPLOAD_CLIENT_ID" || -z "$SYMBOL_UPLOAD_CLIENT_SECRET" ]]; then
            echo "macOS: symbols not uploaded: the BugSplat secrets aren't all set." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for triple in aarch64-apple-darwin x86_64-apple-darwin; do
            npx symbol-upload -a Markydowny -v "$VERSION" -d "src-tauri/target/$triple/release" -f markydowny.dSYM -m
          done
          echo "macOS: symbols uploaded for $VERSION." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-universal
          path: dist-release/*.dmg
          if-no-files-found: error

  linux:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 2
      # Crashpad's headers need Clang; GCC rejects them.
      CC: clang
      CXX: clang++
      # Keep the line tables in the binary rather than a .dwp, so dump_syms reads them directly.
      CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: "off"
      BUGSPLAT_CRASHPAD_CACHE: ${{ github.workspace }}/.crashpad-cache
      BUGSPLAT_DATABASE: ${{ secrets.BUGSPLAT_DATABASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            .crashpad-cache
          key: release-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('src-tauri/Cargo.lock', 'rust-toolchain.toml') }}
      # The packages scripts/build-desktop.sh installs: Tauri's WebKitGTK prerequisites, and
      # CMake, Ninja and Clang for BugSplat's native code.
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            build-essential clang file pkg-config cmake ninja-build libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev
      # --include=dev: the Tauri CLI is a devDependency.
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Build .deb and .AppImage
        env:
          # linuxdeploy is itself an AppImage, and the runners have no FUSE to mount it.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: npx tauri build --bundles deb,appimage
      # Tauri writes the semver into the .deb as is, and dpkg reads 1.2.0-beta.1 as 1.2.0 with
      # revision beta.1, newer than 1.2.0, so the final release wouldn't upgrade a prerelease.
      # 1.2.0~beta.1 sorts before 1.2.0, as the prerelease should.
      - name: Give a prerelease .deb a version that sorts before the release
        if: needs.version.outputs.prerelease == 'true'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          deb_version=$(sed -e 's/-/~/' -e 's/-/./g' <<< "$VERSION")
          for deb in src-tauri/target/release/bundle/deb/*.deb; do
            tree=$(mktemp -d)
            dpkg-deb -R "$deb" "$tree"
            sed -i "s/^Version: .*/Version: $deb_version/" "$tree/DEBIAN/control"
            dpkg-deb --root-owner-group -b "$tree" "$deb"
            dpkg-deb -f "$deb" Version
            rm -rf "$tree"
          done
      # bugsplat-native looks for its helpers next to the executable (/usr/bin), where
      # tauri.conf.json's bundle.linux files put them. Without them crash reporting is off.
      # Tauri's .deb names its files usr/bin/…, with no leading ./ as dpkg-deb's own have.
      - name: Check the crash reporting helpers are packaged
        run: |
          contents=$(dpkg-deb -c src-tauri/target/release/bundle/deb/*.deb)
          appdir=$(echo src-tauri/target/release/bundle/appimage/*.AppDir)
          for helper in BugSplatMonitor BugSplatReporter; do
            grep -qE "( |\./)usr/bin/$helper\$" <<< "$contents" || { echo "$helper is missing from the .deb"; exit 1; }
            [[ -x "$appdir/usr/bin/$helper" ]] || { echo "$helper is missing from the AppImage"; exit 1; }
          done
      - name: Crash reporting
        run: |
          if [[ -n "$BUGSPLAT_DATABASE" ]]; then
            echo "Linux ${{ matrix.arch }}: crash reporting is on." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Linux ${{ matrix.arch }}: crash reporting is **off**: the BUGSPLAT_DATABASE secret isn't set." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload symbols
        if: github.ref_type == 'tag'
        continue-on-error: true
        env:
          SYMBOL_UPLOAD_CLIENT_ID: ${{ secrets.SYMBOL_UPLOAD_CLIENT_ID }}
          SYMBOL_UPLOAD_CLIENT_SECRET: ${{ secrets.SYMBOL_UPLOAD_CLIENT_SECRET }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [[ -z "$BUGSPLAT_DATABASE" || -z "$SYMBOL_UPLOAD_CLIENT_ID" || -z "$SYMBOL_UPLOAD_CLIENT_SECRET" ]]; then
            echo "Linux ${{ matrix.arch }}: symbols not uploaded: the BugSplat secrets aren't all set." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npx symbol-upload -a Markydowny -v "$VERSION" -d src-tauri/target/release -f markydowny -m
          echo "Linux ${{ matrix.arch }}: symbols uploaded for $VERSION." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # x64 only: an arm64 build needs bugsplat-native's Crashpad prebuilt for Windows on Arm.
  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 2
      BUGSPLAT_CRASHPAD_CACHE: ${{ github.workspace }}/.crashpad-cache
      BUGSPLAT_DATABASE: ${{ secrets.BUGSPLAT_DATABASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            .crashpad-cache
          key: release-${{ runner.os }}-x64-${{ hashFiles('src-tauri/Cargo.lock', 'rust-toolchain.toml') }}
      # As in ci.yml's windows job: bugsplat-sys needs MSVC on PATH and Ninja, and the build
      # steps run in PowerShell because Git Bash puts its own link.exe ahead of MSVC's.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Ninja
        run: if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja --no-progress -y }
      - run: npm ci --include=dev --no-audit --no-fund
      # WiX only takes a numeric prerelease (1.2.0-1), so a prerelease like 1.2.0-beta.1 ships
      # the NSIS installer alone.
      - name: Build the installers
        env:
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          $bundles = if ($env:PRERELEASE -eq 'true') { 'nsis' } else { 'nsis,msi' }
          npx tauri build --bundles $bundles
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # bugsplat-native looks for its helpers next to the executable, where tauri.windows.conf.json's
      # bundle.resources put them, and the reporter reads theme\ beside itself. Without them crash
      # reporting is off. This installs each package into a folder of its own and looks there.
      - name: Check the crash reporting helpers are installed
        run: |
          $bundle = 'src-tauri\target\release\bundle'
          $expected = 'markydowny.exe', 'BugSplatMonitor.exe', 'BugSplatReporter.exe', 'theme\theme.json'
          function Test-Installed($dir, $package) {
            foreach ($file in $expected) {
              if (-not (Test-Path (Join-Path $dir $file))) { throw "$file is missing from the $package install in $dir" }
            }
            Write-Output "The $package install has $($expected -join ', ')"
          }
          $setup = Get-Item "$bundle\nsis\*-setup.exe"
          $nsis = Join-Path $env:RUNNER_TEMP 'installed-nsis'
          # /S installs silently; /D= has to come last, unquoted.
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S', "/D=$nsis" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "The NSIS installer exited with $($p.ExitCode)" }
          Test-Installed $nsis 'NSIS'
          $msi = Get-Item "$bundle\msi\*.msi" -ErrorAction SilentlyContinue
          if ($msi) {
            # An administrative install unpacks the files without installing anything.
            $unpacked = Join-Path $env:RUNNER_TEMP 'installed-msi'
            $p = Start-Process msiexec.exe -ArgumentList '/a', "`"$($msi.FullName)`"", '/qn', "TARGETDIR=`"$unpacked`"" -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "msiexec /a exited with $($p.ExitCode)" }
            $exe = Get-ChildItem $unpacked -Recurse -Filter markydowny.exe | Select-Object -First 1
            if (-not $exe) { throw "markydowny.exe is missing from the MSI" }
            Test-Installed $exe.DirectoryName 'MSI'
          }
      # TODO(windows-signing): sign markydowny.exe and the installers once there's a Windows
      # code-signing certificate (bundle.windows.signCommand in tauri.windows.conf.json), and
      # take the SmartScreen line out of the release notes.
      - name: Code signing
        shell: bash
        run: echo "Windows: **not code-signed**: there's no Windows certificate yet, so SmartScreen warns the first time the installer runs." >> "$GITHUB_STEP_SUMMARY"
      - name: Crash reporting
        shell: bash
        run: |
          if [[ -n "$BUGSPLAT_DATABASE" ]]; then
            echo "Windows x64: crash reporting is on." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Windows x64: crash reporting is **off**: the BUGSPLAT_DATABASE secret isn't set." >> "$GITHUB_STEP_SUMMARY"
          fi
      # BugSplat reads the .pdb itself, so there's no dump_syms (-m) step as on the other platforms.
      - name: Upload symbols
        if: github.ref_type == 'tag'
        continue-on-error: true
        shell: bash
        env:
          SYMBOL_UPLOAD_CLIENT_ID: ${{ secrets.SYMBOL_UPLOAD_CLIENT_ID }}
          SYMBOL_UPLOAD_CLIENT_SECRET: ${{ secrets.SYMBOL_UPLOAD_CLIENT_SECRET }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [[ -z "$BUGSPLAT_DATABASE" || -z "$SYMBOL_UPLOAD_CLIENT_ID" || -z "$SYMBOL_UPLOAD_CLIENT_SECRET" ]]; then
            echo "Windows x64: symbols not uploaded: the BugSplat secrets aren't all set." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npx symbol-upload -a Markydowny -v "$VERSION" -d src-tauri/target/release -f "markydowny.{exe,pdb}"
          echo "Windows x64: symbols uploaded for $VERSION." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  release:
    # Only for a tag, pushed or dispatched on: dry runs stop after the builds.
    if: github.ref_type == 'tag'
    needs: [version, mac, linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      # The Linux and Windows jobs upload from two folders each (bundle/deb and bundle/appimage,
      # bundle/nsis and bundle/msi), and the download keeps them as subfolders. Everything goes on the release side by side, so move every file
      # to the top; a name clash leaves a file behind in its folder and fails here.
      - name: Gather the files
        working-directory: artifacts
        run: |
          find . -mindepth 2 -type f -exec mv -n {} . \;
          find . -mindepth 1 -type d -empty -delete
          if [[ -n "$(find . -mindepth 1 -type d)" ]]; then
            echo "::error::Two release files have the same name:"; find . -mindepth 2 -type f; exit 1
          fi
          ls -l
      # markydowny.com's download links use releases/latest/download/<name>, which needs a name
      # without the version. Each glob must match exactly one file, or cp fails the run.
      - name: Add fixed-name copies for the download page
        working-directory: artifacts
        run: |
          cp Markydowny-*-universal.dmg Markydowny-mac.dmg
          cp Markydowny_*_amd64.deb markydowny-linux-x86_64.deb
          cp Markydowny_*_arm64.deb markydowny-linux-arm64.deb
          cp Markydowny_*_amd64.AppImage Markydowny-linux-x86_64.AppImage
          cp Markydowny_*_aarch64.AppImage Markydowny-linux-arm64.AppImage
          cp Markydowny_*_x64-setup.exe Markydowny-windows-x64-setup.exe
          ls -l
      - name: Checksums
        working-directory: artifacts
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # A notarized .dmg opens like any other; one that isn't needs the quarantine flag cleared.
      - name: Release notes
        env:
          NOTARIZED: ${{ needs.mac.outputs.notarized }}
        run: |
          if [[ "$NOTARIZED" == "true" ]]; then
            cat > notes.md <<'NOTES'
          ## Installing

          **macOS** (Apple silicon and Intel, macOS 12 or later): open the `.dmg` and drag Markydowny to Applications. It's signed and notarized by Apple.
          NOTES
          else
            cat > notes.md <<'NOTES'
          ## Installing

          **macOS** (Apple silicon and Intel, macOS 12 or later): open the `.dmg` and drag Markydowny to Applications. This build isn't notarized, so macOS refuses to open a copy downloaded with a browser. Clear the quarantine flag once:

              xattr -dr com.apple.quarantine /Applications/Markydowny.app

          Or download it with `gh release download`, which doesn't set the flag.
          NOTES
          fi
          cat >> notes.md <<'NOTES'

          **Linux** (x86_64 and arm64): the `.deb` and `.AppImage` need glibc 2.38 or newer: Ubuntu 24.04, Debian 13, Fedora 39 and later.

          **Windows** (x64, Windows 10 and 11): run the `x64-setup.exe` installer, or install the `.msi` (prereleases have the installer only). They aren't code-signed yet, so SmartScreen warns the first time. Windows: click **More info**, then **Run anyway**.

          `SHA256SUMS.txt` has a checksum for every file (`sha256sum -c SHA256SUMS.txt --ignore-missing`).
          NOTES
      # The release starts as a draft so every file is attached before anyone can see it, then the
      # next step publishes it. Re-running a tag whose release is still a draft (a run that failed
      # part way) replaces its files and notes rather than making a second release, so the notes
      # say whether the .dmg now attached is notarized. A release that's already published is left
      # alone.
      - name: Create or update the draft release
        run: |
          draft=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | .draft")
          if [[ "$draft" == "true" ]]; then
            gh release upload "$TAG" artifacts/* --clobber
            # As gh release create --generate-notes does: these notes, then the generated ones.
            { cat notes.md; echo; gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
                -f tag_name="$TAG" --jq .body; } > full-notes.md
            gh release edit "$TAG" --notes-file full-notes.md
            echo "Replaced the files and notes on the draft release for $TAG." >> "$GITHUB_STEP_SUMMARY"
          elif [[ -n "$draft" ]]; then
            echo "::error::$TAG is already published; delete the release to rebuild it."
            exit 1
          else
            prerelease=()
            [[ "$PRERELEASE" == "true" ]] && prerelease=(--prerelease)
            gh release create "$TAG" artifacts/* --draft --verify-tag --generate-notes \
              --notes-file notes.md --title "Markydowny $VERSION" "${prerelease[@]}"
            echo "Created a draft release for $TAG." >> "$GITHUB_STEP_SUMMARY"
          fi
      # Publish once every file is attached. A prerelease (a tag with a hyphen) stays a prerelease
      # and never becomes "latest".
      - name: Publish the release
        run: |
          latest=(--latest)
          [[ "$PRERELEASE" == "true" ]] && latest=(--latest=false)
          gh release edit "$TAG" --draft=false "${latest[@]}"
          url=$(gh release view "$TAG" --json url --jq .url)
          echo "Published $TAG: $url" >> "$GITHUB_STEP_SUMMARY"

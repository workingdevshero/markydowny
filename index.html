<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta property="og:site_name" content="Markydowny">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">

    <!-- Canonical URL -->
    <link rel="canonical" href="https://markydowny.com/">

    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="marky.png">

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",

        "url": "https://markydowny.com/",

        },

        "programmingLanguage": "JavaScript"
    }

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .container.fullscreen {
            max-width: 100%;
            height: 100vh;
            border-radius: 0;
            box-shadow: none;
        }

        .header {
            background: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .header p {
            opacity: 0.8;
        }

        .drop-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            border: 3px dashed #e1e8ed;
            margin: 40px;
            border-radius: 8px;
            background: #f8f9fa;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .drop-zone:hover {
            border-color: #667eea;
            background: #f0f2ff;
        }

        .drop-zone.dragover {
            border-color: #667eea;
            background: #f0f2ff;
            transform: scale(1.02);
        }

        .mascot {
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
            transition: transform 0.3s ease;
        }

        .drop-zone:hover .mascot {
            transform: scale(1.1);
        }

        .drop-zone.dragover .mascot {
            transform: scale(1.15) rotate(5deg);
        }

        .mascot {
            will-change: transform;
        }

        .drop-text {
            font-size: 1.25rem;
            color: #2c3e50;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .drop-subtext {
            color: #6c757d;
            font-size: 0.9rem;
        }

        .markdown-content {
            display: none;
            padding: 40px;
            line-height: 1.6;
            color: #2c3e50;
            position: relative;
        }

        .container.fullscreen .markdown-content {
            padding: 60px;
            height: 100vh;
            overflow-y: auto;
        }

        .markdown-content h1,
        .markdown-content h2,
        .markdown-content h3,
        .markdown-content h4,
        .markdown-content h5,
        .markdown-content h6 {
            margin-bottom: 16px;
            margin-top: 24px;
            color: #2c3e50;
        }

        .markdown-content h1 {
            border-bottom: 2px solid #e1e8ed;
            padding-bottom: 8px;
        }

        .markdown-content p {
            margin-bottom: 16px;
        }

        .markdown-content code {
            background: #f8f9fa;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
        }

        .markdown-content pre {
            background: #f8f9fa;
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            margin-bottom: 16px;
        }

        .markdown-content blockquote {
            border-left: 4px solid #667eea;
            padding-left: 16px;
            margin: 16px 0;
            color: #6c757d;
        }

        .markdown-content ul,
        .markdown-content ol {
            margin-bottom: 16px;
            padding-left: 24px;
        }

        .markdown-content li {
            margin-bottom: 8px;
        }

        .markdown-content img {
            max-width: 100%;
            height: auto;
            max-height: 400px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: block;
            margin: 16px auto;
        }

        .markdown-content img:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
        }

        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            cursor: pointer;
        }

        .lightbox-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 95%;
            max-height: 95%;
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .lightbox-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease;
            z-index: 2001;
        }

        .lightbox-close:hover {
            background: rgba(0, 0, 0, 0.9);
        }

        .lightbox-info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            max-width: 80%;
            text-align: center;
            z-index: 2001;
        }

        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: none;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
            transition: all 0.3s ease;
        }

        .back-button:hover {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
        }

        .back-button {
            will-change: transform;
        }

        .fullscreen-button {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #667eea;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: none;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
            transition: all 0.3s ease;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fullscreen-button:hover {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
        }

        .fullscreen-button {
            will-change: transform;
        }

        .container.fullscreen .fullscreen-button {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .container.fullscreen .header {
            display: none;
        }

        .container.fullscreen body {
            padding: 0;
        }

        .file-selector {
            display: none;
            padding: 40px;
            background: white;
        }

        .file-selector h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
        }

        .file-list {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #e1e8ed;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .container.fullscreen.file-selector-active .file-list {
            max-height: 300px;
        }

        .container.fullscreen.file-selector-active .file-selector {
            padding: 60px 60px 30px 60px;
        }

        .container.file-selector-active .file-selector {
            border-bottom: 1px solid #e1e8ed;
        }

        .container.file-selector-active .file-list {
            max-height: 250px;
        }

        .container.fullscreen.file-selector-active {
            height: 100vh;
            overflow-y: auto;
        }

        .container.fullscreen.file-selector-active .markdown-content {
            padding: 30px 60px 60px 60px;
            height: auto;
            overflow-y: visible;
        }

        .file-item {
            padding: 12px 16px;
            border-bottom: 1px solid #e1e8ed;
            cursor: pointer;
            transition: background 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .file-item:hover {
            background: #f8f9fa;
        }

        .file-item.selected {
            background: #e3f2fd;
            border-left: 4px solid #667eea;
        }

        .file-item:last-child {
            border-bottom: none;
        }

        .file-icon {
            font-size: 1.2rem;
        }

        .file-path {
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 0.9rem;
            color: #6c757d;
        }

        .selector-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .selector-button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .selector-button:hover {
            background: #5a67d8;
        }

        .selector-button.secondary {
            background: #6c757d;
        }

        .selector-button.secondary:hover {
            background: #5a6268;
        }

        .footer {
            background: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 0.9rem;
        }

        .footer-links {
            margin-top: 10px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: #ffffff;
            text-decoration: none;
            transition: color 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .footer-icon {
            width: 20px;
            height: 20px;
            filter: brightness(0) invert(1);
            transition: filter 0.3s ease;
        }

        .footer-links a:hover .footer-icon {
            filter: brightness(0) invert(1) drop-shadow(0 0 3px rgba(255, 255, 255, 0.5));
        }

        .footer-links a:hover {
            color: rgba(255, 255, 255, 0.8);
        }

        .container.fullscreen .footer {
            display: none;
        }

        @media (max-width: 600px) {
            .footer-links {
                flex-direction: column;
                gap: 10px;
            }
        }

        .file-input {
            display: none;
        }

        .upload-button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 16px;
            transition: background 0.3s ease;
        }

        .upload-button:hover {
            background: #5a67d8;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
            }
            
            .drop-zone {
                margin: 20px;
                min-height: 300px;
            }
            
            .markdown-content {
                padding: 20px;
            }

            .container.fullscreen .markdown-content {
                padding: 30px;
            }
        }

        .render-error {
            padding: 20px;
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 4px;
            color: #721c24;
        }

        .render-error pre {
            background: white;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
            white-space: pre-wrap;
        }

        .markdown-content table {
            border-collapse: collapse;
            margin-bottom: 16px;
            display: block;
            overflow-x: auto;
        }

        .markdown-content th,
        .markdown-content td {
            border: 1px solid #e1e8ed;
            padding: 6px 13px;
        }

        .markdown-content hr {
            border: none;
            border-top: 2px solid #e1e8ed;
            margin: 24px 0;
        }

        .markdown-content a {
            color: #5a67d8;
        }

        /* ---------- Desktop app (body.desktop is set when running in Tauri) ---------- */

        body.desktop {
            display: block;
            padding: 0 !important;
            background: #ffffff;
        }

        body.desktop .container {
            max-width: none;
            min-height: 100vh;
            border-radius: 0;
            box-shadow: none;
            overflow: visible;
            background: transparent;
        }

        body.desktop .header,
        body.desktop .footer,
        body.desktop .back-button,
        body.desktop .fullscreen-button {
            display: none !important;
        }

        body.desktop .drop-zone {
            margin: 24px;
            min-height: calc(100vh - 48px);
        }

        body.desktop .markdown-content,
        body.desktop .file-selector {
            max-width: 900px;
            margin: 0 auto;
        }

        body.desktop .markdown-content {
            padding: 40px 48px 80px;
        }

        body.desktop .markdown-content img {
            max-height: 70vh;
        }

        @media (prefers-color-scheme: dark) {
            body.desktop {
                background: #1e1f22;
                color-scheme: dark;
            }

            body.desktop .markdown-content,
            body.desktop .markdown-content h1,
            body.desktop .markdown-content h2,
            body.desktop .markdown-content h3,
            body.desktop .markdown-content h4,
            body.desktop .markdown-content h5,
            body.desktop .markdown-content h6,
            body.desktop .drop-text,
            body.desktop .file-selector h2 {
                color: #dcdfe4;
            }

            body.desktop .markdown-content code,
            body.desktop .markdown-content pre {
                background: #2b2d31;
            }

            body.desktop .markdown-content h1,
            body.desktop .markdown-content hr,
            body.desktop .markdown-content th,
            body.desktop .markdown-content td,
            body.desktop .file-list,
            body.desktop .file-item {
                border-color: #3a3d44;
            }

            body.desktop .markdown-content blockquote,
            body.desktop .drop-subtext,
            body.desktop .file-path {
                color: #9aa0a9;
            }

            body.desktop .markdown-content a {
                color: #8ea2ff;
            }

            body.desktop .drop-zone {
                background: #26282c;
                border-color: #3a3d44;
            }

            body.desktop .drop-zone:hover,
            body.desktop .drop-zone.dragover {
                background: #2a2d3d;
                border-color: #667eea;
            }

            body.desktop .file-selector {
                background: transparent;
            }

            body.desktop .file-item:hover {
                background: #2b2d31;
            }

            body.desktop .file-item.selected {
                background: #2a2d3d;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>📝 Markydowny</h1>
            <p>Drag and drop your markdown files to see them beautifully rendered</p>
        </header>

        <main>
            <div class="drop-zone" id="dropZone">
            <img src="marky.png" alt="Marky Downy" class="mascot" />
            <div class="drop-text">Drop your markdown file or folder here</div>
            <div class="drop-subtext">or click to browse files</div>
            <button class="upload-button" id="uploadButton" type="button">
                Choose File
            </button>
            </div>

            <div class="file-selector" id="fileSelector">
                <h2>📁 Multiple Markdown Files Found</h2>
                <p style="text-align: center; color: #6c757d; margin-bottom: 20px;">
                    Choose which markdown file you'd like to view:
                </p>
                <div class="file-list" id="fileList"></div>
                <div class="selector-buttons">
                    <button class="selector-button secondary" id="cancelSelector" type="button">
                        Cancel
                    </button>
                </div>
            </div>

            <div class="markdown-content" id="markdownContent">
                <button class="fullscreen-button" id="fullscreenButton" title="Toggle Fullscreen">
                    ⛶
                </button>
            </div>

            <input type="file" id="fileInput" class="file-input" accept=".md,.markdown,.txt">
        </main>
        
        <footer class="footer">
            <div class="footer-links">
                <a href="https://workingdevshero.com" target="_blank" rel="noopener noreferrer">
                    <img src="web.svg" alt="Website" class="footer-icon" />
                    Website
                </a>
                <a href="https://discord.gg/UxNXrBukjZ" target="_blank" rel="noopener noreferrer">
                    <img src="discord.svg" alt="Discord" class="footer-icon" />
                    Discord
                </a>
                <a href="https://github.com/workingdevshero" target="_blank" rel="noopener noreferrer">
                    <img src="github.svg" alt="GitHub" class="footer-icon" />
                    GitHub
                </a>
                <a href="https://x.com/workingdevshero" target="_blank" rel="noopener noreferrer">
                    <img src="x.svg" alt="X" class="footer-icon" />
                    X
                </a>
            </div>
        </footer>
    </div>
    
    <!-- Lightbox for image expansion -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightboxClose">✕</button>
        <div class="lightbox-content">
            <img class="lightbox-image" id="lightboxImage" alt="">
        </div>
        <div class="lightbox-info" id="lightboxInfo"></div>
    </div>
    
    <button class="back-button" id="backButton">
        ← Back to Drop Zone
    </button>

    <script src="js/vendor/marked.umd.js"></script>
    <script src="js/core.js"></script>
    <script src="js/app.js"></script>
</body>
</html>

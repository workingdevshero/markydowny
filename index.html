<head>

    <style>
        :root {
            color-scheme: light dark;
            --bg: #f5f4f0;
            --surface: #ffffff;
            --surface-2: #f4f5f7;
            --text: #1d2635;
            --text-muted: #5d6879;
            --border: #e2e4e9;
            --accent: #2f5aa8;
            --accent-hover: #264b8f;
            --accent-soft: #e9effa;
            --accent-text: #ffffff;
            --coral: #ef7f63;
            --code-bg: #f4f5f7;
            --shadow: 0 1px 2px rgba(29, 38, 53, 0.04), 0 8px 24px rgba(29, 38, 53, 0.06);
            --radius: 16px;
            --font-sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #12151a;
                --surface: #191d24;
                --surface-2: #20252e;
                --text: #e5e9f0;
                --text-muted: #9aa4b4;
                --border: #2b313b;
                --accent: #7ea3f7;
                --accent-hover: #9ab7fa;
                --accent-soft: rgba(126, 163, 247, 0.12);
                --accent-text: #0f1626;
                --coral: #f2957d;
                --code-bg: #20252e;
                --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
            }
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
            border-radius: 6px;
        }

        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
            width: 100%;
            max-width: 920px;
            margin: 0 auto;
            padding: 32px 24px 48px;
        }

        /* ---------- Buttons ---------- */

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            line-height: 1;
            border-radius: 10px;
            border: 1px solid transparent;
            padding: 10px 16px;
            cursor: pointer;
            transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
        }

        .btn svg {
            width: 18px;
            height: 18px;
            flex: none;
        }

        .btn-primary {
            background: var(--accent);
            color: var(--accent-text);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-muted);
            border-color: var(--border);
        }

        .btn-ghost:hover {
            color: var(--text);
            background: var(--surface-2);
        }

        .btn-icon {
            padding: 8px;
        }

        /* ---------- Top bar ---------- */

        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            display: grid;
            grid-template-columns: 1fr minmax(0, auto) 1fr;
            align-items: center;
            gap: 16px;
            height: 60px;
            padding: 0 24px;
            background: color-mix(in srgb, var(--bg) 82%, transparent);
            backdrop-filter: saturate(160%) blur(12px);
            -webkit-backdrop-filter: saturate(160%) blur(12px);
            border-bottom: 1px solid var(--border);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.05rem;
            letter-spacing: -0.01em;
        }

        .brand-mark {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--accent-soft);
            object-fit: contain;
            padding: 2px;
        }

        .doc-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
        }

        .topbar-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        /* Shown by app.js once a document is open. */
        .back-button,
        .fullscreen-button {
            display: none;
        }

        .fullscreen-button .icon-collapse,
        .container.fullscreen .fullscreen-button .icon-expand {
            display: none;
        }

        .container.fullscreen .fullscreen-button .icon-collapse {
            display: block;
        }

        /* ---------- Drop zone ---------- */

        .drop-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: min(560px, calc(100vh - 220px));
            padding: 48px 24px;
            background: var(--surface);
            border: 2px dashed var(--border);
            border-radius: 24px;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: border-color 0.2s ease, background-color 0.2s ease, transform 0.2s ease;
        }

        .drop-zone:hover {
            border-color: color-mix(in srgb, var(--accent) 45%, var(--border));
        }

        .drop-zone.dragover {
            border-color: var(--accent);
            background: var(--accent-soft);
            transform: scale(1.01);
        }

        .mascot {
            width: 132px;
            height: 132px;
            margin-bottom: 24px;
            transition: transform 0.3s ease;
            will-change: transform;
        }

        .drop-zone:hover .mascot {
            transform: translateY(-4px) rotate(-3deg);
        }

        .drop-zone.dragover .mascot {
            transform: scale(1.1) rotate(4deg);
        }

        .drop-title {
            font-size: clamp(1.6rem, 3vw, 2.1rem);
            font-weight: 750;
            letter-spacing: -0.025em;
            line-height: 1.15;
            margin-bottom: 10px;
        }

        .drop-text {
            font-size: 1.05rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .drop-subtext {
            font-size: 0.9rem;
            color: var(--text-muted);
            opacity: 0.85;
        }

        .upload-button {
            margin-top: 24px;
            padding: 12px 20px;
            font-size: 0.95rem;
        }

        .drop-hint {
            margin-top: 16px;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-muted);
            opacity: 0.75;
        }

        .file-input {
            display: none;
        }

        /* ---------- File selector ---------- */

        .file-selector {
            display: none;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 28px;
            margin-bottom: 24px;
        }

        .file-selector h2 {
            font-size: 1.15rem;
            letter-spacing: -0.01em;
            margin-bottom: 4px;
        }

        .file-selector-hint {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 18px;
        }

        .file-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 360px;
            overflow-y: auto;
            margin-bottom: 18px;
        }

        .container.file-selector-active .file-list {
            max-height: 240px;
        }

        .file-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: background-color 0.15s ease, border-color 0.15s ease;
        }

        .file-item:hover {
            background: var(--surface-2);
        }

        .file-item.selected {
            background: var(--accent-soft);
            border-color: color-mix(in srgb, var(--accent) 35%, transparent);
        }

        .file-icon {
            display: flex;
            color: var(--accent);
        }

        .file-icon svg {
            width: 20px;
            height: 20px;
        }

        .file-name {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .file-path {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .selector-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .selector-buttons .btn[hidden] {
            display: none;
        }

        /* ---------- Rendered markdown ---------- */

        .markdown-content {
            display: none;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 56px 64px;
            font-size: 1.0625rem;
            line-height: 1.7;
            overflow-wrap: break-word;
        }

        .markdown-content > :first-child {
            margin-top: 0;
        }

        .markdown-content h1,
        .markdown-content h2,
        .markdown-content h3,
        .markdown-content h4,
        .markdown-content h5,
        .markdown-content h6 {
            line-height: 1.25;
            letter-spacing: -0.02em;
            margin: 1.8em 0 0.6em;
            scroll-margin-top: 80px;
        }

        .markdown-content h1 {
            font-size: 2.25rem;
            letter-spacing: -0.03em;
            margin-top: 0;
        }

        .markdown-content h2 {
            font-size: 1.5rem;
            padding-bottom: 0.35em;
            border-bottom: 1px solid var(--border);
        }

        .markdown-content h3 { font-size: 1.2rem; }
        .markdown-content h4 { font-size: 1.05rem; }
        .markdown-content h5,
        .markdown-content h6 {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-muted);
        }

        .markdown-content p,
        .markdown-content ul,
        .markdown-content ol,
        .markdown-content blockquote,
        .markdown-content pre,
        .markdown-content table {
            margin-bottom: 1.1em;
        }

        .markdown-content ul,
        .markdown-content ol {
            padding-left: 1.5em;
        }

        .markdown-content li + li {
            margin-top: 0.3em;
        }

        .markdown-content li > ul,
        .markdown-content li > ol {
            margin: 0.3em 0 0;
        }

        .markdown-content li::marker {
            color: var(--text-muted);
        }

        .markdown-content li:has(> input[type="checkbox"]) {
            list-style: none;
            margin-left: -1.5em;
        }

        /* marked renders task boxes disabled, which browsers grey out, so they are drawn here. */
        .markdown-content input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            display: inline-grid;
            place-content: center;
            width: 1.05em;
            height: 1.05em;
            margin-right: 0.55em;
            vertical-align: -0.15em;
            border: 1.5px solid color-mix(in srgb, var(--text-muted) 70%, transparent);
            border-radius: 5px;
            background: var(--surface);
        }

        .markdown-content input[type="checkbox"]:checked {
            background: var(--accent);
            border-color: var(--accent);
        }

        .markdown-content input[type="checkbox"]:checked::before {
            content: "";
            width: 0.6em;
            height: 0.6em;
            background: var(--accent-text);
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }

        .markdown-content li:has(> input[type="checkbox"]:checked) {
            color: var(--text-muted);
        }

        .markdown-content a {
            color: var(--accent);
            text-decoration: underline;
            text-decoration-thickness: 1px;
            text-underline-offset: 3px;
            text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent);
        }

        .markdown-content a:hover {
            text-decoration-color: var(--accent);
        }

        .markdown-content strong {
            font-weight: 650;
        }

        .markdown-content code {
            font-family: var(--font-mono);
            font-size: 0.875em;
            background: var(--code-bg);
            border: 1px solid var(--border);
            padding: 0.1em 0.4em;
            border-radius: 6px;
        }

        .markdown-content pre {
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
            overflow-x: auto;
            line-height: 1.55;
        }

        .markdown-content pre code {
            background: none;
            border: 0;
            padding: 0;
            font-size: 0.85em;
        }

        .markdown-content blockquote {
            border-left: 3px solid var(--coral);
            background: color-mix(in srgb, var(--coral) 7%, transparent);
            border-radius: 0 10px 10px 0;
            padding: 12px 18px;
            color: var(--text-muted);
        }

        .markdown-content blockquote > :last-child {
            margin-bottom: 0;
        }

        .markdown-content table {
            display: block;
            width: max-content;
            max-width: 100%;
            overflow-x: auto;
            border-collapse: separate;
            border-spacing: 0;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 0.95em;
        }

        .markdown-content th,
        .markdown-content td {
            padding: 8px 14px;
            border-bottom: 1px solid var(--border);
        }

        .markdown-content th + th,
        .markdown-content td + td {
            border-left: 1px solid var(--border);
        }

        .markdown-content tr:last-child td {
            border-bottom: 0;
        }

        .markdown-content th {
            background: var(--surface-2);
            font-weight: 650;
            text-align: left;
        }

        .markdown-content tbody tr:nth-child(even) {
            background: color-mix(in srgb, var(--surface-2) 50%, transparent);
        }

        .markdown-content hr {
            border: 0;
            height: 1px;
            background: var(--border);
            margin: 2.2em 0;
        }

        .markdown-content img {
            display: block;
            max-width: 100%;
            height: auto;
            max-height: 480px;
            margin: 1.5em auto;
            border-radius: 12px;
            cursor: zoom-in;
            transition: transform 0.2s ease;
        }

        .markdown-content img:hover {
            transform: scale(1.01);
        }

        .render-error {
            padding: 20px;
            border: 1px solid color-mix(in srgb, #d14343 40%, transparent);
            background: color-mix(in srgb, #d14343 8%, transparent);
            border-radius: 12px;
        }

        .render-error pre {
            margin-top: 12px;
            white-space: pre-wrap;
        }

        /* ---------- Fullscreen: chrome steps back, the page fills the window ---------- */

        .container.fullscreen main {
            max-width: none;
            padding: 0;
        }

        .container.fullscreen .brand {
            visibility: hidden;
        }

        .container.fullscreen .footer {
            display: none;
        }

        .container.fullscreen .markdown-content {
            border: 0;
            border-radius: 0;
            box-shadow: none;
            min-height: calc(100vh - 60px);
            padding: 56px max(64px, calc((100vw - 860px) / 2));
        }

        .container.fullscreen .file-selector {
            border-radius: 0;
            border-width: 0 0 1px;
            box-shadow: none;
            margin: 0;
            padding: 28px max(64px, calc((100vw - 860px) / 2));
        }

        /* ---------- Footer ---------- */

        .footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            width: 100%;
            max-width: 920px;
            margin: 0 auto;
            padding: 20px 24px 32px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .footer-credit a {
            color: inherit;
            font-weight: 600;
            text-decoration: none;
        }

        .footer-links {
            display: flex;
            gap: 4px;
        }

        .footer-links a {
            display: flex;
            padding: 8px;
            border-radius: 8px;
            opacity: 0.7;
            transition: opacity 0.15s ease, background-color 0.15s ease;
        }

        .footer-links a:hover {
            opacity: 1;
            background: var(--surface-2);
        }

        .footer-icon {
            width: 18px;
            height: 18px;
        }

        @media (prefers-color-scheme: dark) {
            .footer-icon {
                filter: invert(1);
            }
        }

        /* ---------- Lightbox ---------- */

        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(10, 12, 16, 0.86);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 2000;
            cursor: zoom-out;
        }

        .lightbox-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 94%;
            max-height: 90%;
        }

        .lightbox-image {
            display: block;
            max-width: 94vw;
            max-height: 86vh;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.45);
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 2001;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.15s ease;
        }

        .lightbox-close:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .lightbox-close svg {
            width: 18px;
            height: 18px;
        }

        .lightbox-info {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            max-width: 80%;
            padding: 8px 16px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 0.85rem;
            text-align: center;
            z-index: 2001;
        }

        /* ---------- Small screens ---------- */

        @media (max-width: 700px) {
            .topbar {
                padding: 0 16px;
                grid-template-columns: auto minmax(0, 1fr) auto;
            }

            .doc-title {
                text-align: left;
            }

            .brand-name {
                display: none;
            }

            .back-button-label {
                display: none;
            }

            main {
                padding: 16px 12px 32px;
            }

            .markdown-content {
                padding: 28px 22px;
                font-size: 1rem;
            }

            .markdown-content h1 {
                font-size: 1.8rem;
            }

            .container.fullscreen .markdown-content,
            .container.fullscreen .file-selector {
                padding-left: 22px;
                padding-right: 22px;
            }

            .footer {
                justify-content: center;
                text-align: center;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition: none !important;
            }
        }

        /* ---------- Desktop app (body.desktop is set when running in Tauri) ---------- */

        body.desktop .topbar,
        body.desktop .footer {
            display: none !important;
        }

        body.desktop main {
            max-width: none;
            padding: 0;
        }

        body.desktop .drop-zone {
            margin: 20px;
            min-height: calc(100vh - 40px);
            box-shadow: none;
        }

        body.desktop .markdown-content,
        body.desktop .file-selector {
            max-width: 900px;
            margin: 0 auto;
            border: 0;
            border-radius: 0;
            box-shadow: none;
            background: transparent;
        }

        body.desktop .markdown-content {
            padding: 40px 48px 80px;
        }

        body.desktop .file-selector {
            border-bottom: 1px solid var(--border);
        }

        body.desktop .markdown-content img {
            max-height: 70vh;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="topbar">
            <div class="brand">
                <img src="marky.png" alt="" class="brand-mark" />
                <span class="brand-name">Markydowny</span>
            </div>
            <div class="doc-title" id="docTitle"></div>
            <div class="topbar-actions">
                <button class="btn btn-ghost back-button" id="backButton" type="button" title="Close document">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
                    <span class="back-button-label">Open another</span>
                </button>
                <button class="btn btn-ghost btn-icon fullscreen-button" id="fullscreenButton" type="button" title="Enter Fullscreen" aria-label="Toggle fullscreen" aria-pressed="false">
                    <svg class="icon-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
                    <svg class="icon-collapse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3v3a2 2 0 0 1-2 2H3M21 8h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3M16 21v-3a2 2 0 0 1 2-2h3"/></svg>
                </button>
            </div>
        </header>

        <main>
            <div class="drop-zone" id="dropZone" role="button" tabindex="0" aria-label="Choose a markdown file to view">
                <img src="marky.png" alt="Marky Downy, the Markydowny mascot" class="mascot" />
                <h1 class="drop-title">Markdown, beautifully rendered</h1>
                <p class="drop-text">Drop a markdown file or a whole folder here</p>
                <p class="drop-subtext">Images, tables, code and task lists just work. Your files never leave your device.</p>
                <button class="btn btn-primary upload-button" id="uploadButton" type="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 18v-6M9 15l3-3 3 3"/></svg>
                    Choose File
                </button>
                <p class="drop-hint">.md · .markdown · .txt</p>
            </div>

            <section class="file-selector" id="fileSelector">
                <h2>Multiple markdown files found</h2>
                <p class="file-selector-hint">Choose the one you'd like to read.</p>
                <div class="file-list" id="fileList"></div>
                <div class="selector-buttons">
                    <button class="btn btn-ghost" id="cancelSelector" type="button">Cancel</button>
                    <button class="btn btn-primary" id="openAllTabs" type="button" hidden>Open all as tabs</button>
                </div>
            </section>

            <article class="markdown-content" id="markdownContent"></article>

            <input type="file" id="fileInput" class="file-input" accept=".md,.markdown,.txt">
        </main>

                </a>
                <a href="https://github.com/workingdevshero" target="_blank" rel="noopener noreferrer" title="GitHub">
                    <img src="github.svg" alt="GitHub" class="footer-icon" />

    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightboxClose" type="button" aria-label="Close image">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
        <div class="lightbox-content">
            <img class="lightbox-image" id="lightboxImage" alt="">
